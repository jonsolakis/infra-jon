apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fantasy-hockey-stats
  namespace: fantasy-hockey
spec:
  releaseName: fantasy-hockey-stats
  interval: 10m
  timeout: 20m
  chart:
    spec:
      chart: ./charts/fantasy-hockey-stats
      sourceRef:
        kind: GitRepository
        name: fantasy-hockey-stats-chart
      interval: 10m
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
      strategy: rollback
      remediateLastFailure: true
  rollback:
    timeout: 10m
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    fullnameOverride: fantasy-hockey-stats

    api:
      image:
        repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
        tag: api-40bab2e
      replicaCount: 1

    web:
      image:
        repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
        tag: web-e372204

    persistence:
      enabled: true
      storageClass: do-block-storage-retain
      accessModes:
        - ReadWriteOnce
      size: 1Gi

    imagePullSecrets:
      - name: jonsolakis

    seasonImport:
      enabled: true
      seasonIds:
        - "20242025"
        - "20252026"

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: fantasy.jonsolakis.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: fantasy-hockey-stats-tls
          hosts:
            - fantasy.jonsolakis.dev

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fantasy-hockey
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 25m
  path: ./apps/fantasy-hockey
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fantasy-hockey-stats
      namespace: fantasy-hockey

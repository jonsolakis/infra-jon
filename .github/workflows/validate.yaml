name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate

  helmfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Render Helm releases
        working-directory: helmfile
        run: helmfile --environment hobby template
